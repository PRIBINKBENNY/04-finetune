# QLoRA on a free Colab T4 (16 GB, no bf16). ~15-25 min for 2k examples x 2 epochs.
base_model: Qwen/Qwen2.5-0.5B-Instruct   # or unsloth/Llama-3.2-1B-Instruct
output_dir: outputs/qwen0.5b-jobs-lora
load_in_4bit: true                        # QLoRA: 4-bit NF4 base weights, LoRA adapters in fp16

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

train:
  epochs: 2
  lr: 2.0e-4
  batch_size: 8
  grad_accum: 2
  max_seq_len: 512
  warmup_ratio: 0.03
  scheduler: cosine
  logging_steps: 10
  eval_steps: 100
  seed: 42
